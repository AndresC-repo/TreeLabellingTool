server {
    listen 80;
    client_max_body_size 2100m;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_request_buffering off;   # stream big uploads straight to the backend
        # inference and auto-tune on large patches can take several minutes on CPU
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
