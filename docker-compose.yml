# Development stack: hot-reload backend + Vite frontend.
#   docker compose up --build        → http://localhost:5173
# For labelling (no code changes) use docker-compose.prod.yml instead, see README.
services:
  backend:
    build: ./backend
    # The backend image is x86-64 only (PyTorch CPU + spconv wheels). On Apple Silicon
    # Macs Docker Desktop runs it through emulation (Rosetta); elsewhere this is a no-op.
    platform: linux/amd64
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
      - hf_cache:/root/.cache/huggingface      # downloaded models survive rebuilds
      # Labelled patches go to <this folder>/labels, next to labelling_registry.json.
      # Set DATASET_DIR_HOST in .env (default: ./data inside this repo).
      - ${DATASET_DIR_HOST:-./data}:/dataset
    ports:
      - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - DATASET_DIR=/dataset
      - LABELLER=${LABELLER:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-2147483648}
      - DEFAULT_MAX_POINTS=${DEFAULT_MAX_POINTS:-500000}
      # Tell PyTorch/spconv there are zero CUDA devices.
      # spconv-cu118 selects ConvAlgo.MaskImplicitGemm (GPU-only) by default;
      # with no visible CUDA device it falls back to ConvAlgo.Native (CPU).
      # _force_spconv_native() in predictor.py overrides this as well, but
      # setting it here ensures the right choice is made at model-creation time.
      - CUDA_VISIBLE_DEVICES=

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend

volumes:
  storage_data:
  hf_cache:
