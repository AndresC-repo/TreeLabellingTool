services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
    ports:
      - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      # Tell PyTorch/spconv there are zero CUDA devices.
      # spconv-cu118 selects ConvAlgo.MaskImplicitGemm (GPU-only) by default;
      # with no visible CUDA device it falls back to ConvAlgo.Native (CPU).
      # _force_spconv_native() in predictor.py overrides this as well, but
      # setting it here ensures the right choice is made at model-creation time.
      - CUDA_VISIBLE_DEVICES=

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend

volumes:
  storage_data:
